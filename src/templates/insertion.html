{% extends "base.html" %}
{% block title %}Meal insertion{% endblock %}

% block style %

% endblock %
{% block content %}
<!-- CSS HEAD!! -->

<head> <!-- If inside the "Style block", has a different (worst) effect! -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font: 16px Arial;
    }

    /*the container must be positioned relative:*/
    .autocomplete {
      position: relative;
      display: inline-block;
    }

    input {
      border: 1px solid transparent;
      background-color: #f1f1f1;
      padding: 10px;
      font-size: 16px;
    }

    input[type=text] {
      background-color: #f1f1f1;
      width: 100%;
    }

    input[type=submit] {
      background-color: DodgerBlue;
      color: #fff;
      cursor: pointer;
    }

    .autocomplete-items {
      position: absolute;
      border: 1px solid #d4d4d4;
      border-bottom: none;
      border-top: none;
      z-index: 99;
      /*position the autocomplete items to be the same width as the container:*/
      top: 100%;
      left: 0;
      right: 0;
    }

    .autocomplete-items div {
      padding: 10px;
      cursor: pointer;
      background-color: #fff;
      border-bottom: 1px solid #d4d4d4;
    }

    /*when hovering an item:*/
    .autocomplete-items div:hover {
      background-color: #e9e9e9;
    }

    /*when navigating through the items using the arrow keys:*/
    .autocomplete-active {
      background-color: DodgerBlue !important;
      color: #ffffff;
    }
  </style>
</head>

<form method="POST" autocomplete="off">
  <h3 align="center">Insert a meal</h3>
  <div class="form-group">
    <label class="active" for="dateMeal">Date: </label>
    <input type="date" id="dateMeal" name="dateMeal">
  </div>

  <div class="form-check">
    <input class="form-group" type="checkbox" id="startweek" name="Start week" value="">
    <label class="form-check-label">Start Week</label>
  </div>

  <label for="Who" class="form-label">Who: </label>
  <select class="form-select" , name="participants">
    <option>Entrambi</option>
    <option>Luca</option>
    <option>Gioi</option>
  </select>
  <br />

  <label for="Type" class="form-label">Type: </label>
  <select class="form-select" , name="meal_type">
    <option>Pranzo</option>
    <option>Cena</option>
  </select>
  <br />

  <div class="autocomplete">
    <label for="Meal">Meal</label>
    <input type="text" class="form-control" id="meal" name="meal" placeholder="Insert meal" />
  </div>

  <p></p>

  <div class="form-group">
    Dessert: <input type="checkbox" id="myCheck" onclick="myFunction()">
    <label for="Dessert"></label>
    <input type="text" class="form-control" id="dessert" name="dessert" style="display:none" />
  </div>

  <div class="form-group">
    <label for="Notes">Notes</label>
    <input type="text" class="form-control" id="notes" name="notes" />
  </div>

  <br />
  <button type="submit" class="btn btn-primary">Submit</button>
</form>

{% endblock %}

{% block script %}
<script type="text/javascript">
  try {var meal_list = {{ meal_list| tojson}}} catch (error) { console.error(error) }
</script>

<script type="text/javascript">
  function myFunction() {
    // Get the checkbox
    var checkBox = document.getElementById("myCheck");
    // Get the output text
    var text = document.getElementById("text");

    // If the checkbox is checked, display the output text
    if (checkBox.checked == true){
      dessert.style.display = "block";
    } else {
      dessert.style.display = "none";
    }
  } 
</script>

<script type="text/javascript" src="{{ url_for('static', filename='script_autocomplete.js') }}"></script>

<script type="text/javascript" src="https://cdn.jsdelivr.net/gh/xcash/bootstrap-autocomplete@v2.3.7/dist/latest/bootstrap-autocomplete.min.js"></script>
{% endblock %}
