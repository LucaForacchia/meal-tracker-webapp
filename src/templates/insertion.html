{% extends "base.html" %}
{% block title %}Nuovo pasto{% endblock %}

{% block style %}
<style>
  /* Autocomplete container */
  .autocomplete {
    position: relative;
    display: block;
    width: 100%;
  }

  .autocomplete-items {
    position: absolute;
    border: 1px solid #d4d4d4;
    border-bottom: none;
    border-top: none;
    z-index: 99;
    top: 100%;
    left: 0;
    right: 0;
  }

  .autocomplete-items div {
    padding: 14px 12px;
    cursor: pointer;
    background-color: #fff;
    border-bottom: 1px solid #d4d4d4;
    font-size: 16px;
  }

  .autocomplete-items div:hover {
    background-color: #e9e9e9;
  }

  .autocomplete-active {
    background-color: DodgerBlue !important;
    color: #ffffff;
  }

  /* ===== Mobile-first compact layout ===== */
  form input,
  form select,
  form button,
  form .btn,
  form .form-control {
    min-height: 48px;
    font-size: 16px;  /* prevents iOS auto-zoom */
  }

  form .form-group,
  form .row {
    margin-bottom: 0.5rem;
  }

  form button[type="submit"] {
    width: 100%;
    margin-top: 0.3rem;
  }

  input[type="date"] {
    width: 100%;
  }

  .form-heading {
    text-align: center;
    margin-bottom: 0.6rem;
    font-weight: 600;
    font-size: 1.3rem;
  }

  /* Bootstrap custom-switch: enough height for touch, native sizing */
  .custom-switch {
    min-height: 44px;
    padding-top: 4px;
  }
  .custom-switch .custom-control-label {
    font-size: 16px;
  }
</style>
{% endblock %}

{% block content %}
<form method="POST" autocomplete="off">
  <h4 class="form-heading">Nuovo pasto</h4>

  <!-- Date -->
  <div class="form-group">
    <label for="dateMeal">Data</label>
    <input type="date" class="form-control form-control-lg" id="dateMeal"
           name="dateMeal" value="{{ today }}">
  </div>

  <!-- Start Week toggle switch -->
  <div class="custom-control custom-switch mb-2">
    <input type="checkbox" class="custom-control-input" id="startweek-switch"
           onchange="toggleStartWeek()">
    <label class="custom-control-label" for="startweek-switch">Nuova settimana</label>
  </div>
  <input type="hidden" id="startweek-input" name="Start week" value="">

  <!-- Chi + Tipo side by side -->
  <div class="row">
    <div class="col-6">
      <div class="form-group">
        <label for="participants">Chi</label>
        <select class="form-control form-control-lg" id="participants" name="participants">
          <option>Entrambi</option>
          <option>Luca</option>
          <option>Gioi</option>
        </select>
      </div>
    </div>
    <div class="col-6">
      <div class="form-group">
        <label for="meal_type">Tipo</label>
        <select class="form-control form-control-lg" id="meal_type" name="meal_type">
          <option>Pranzo</option>
          <option>Cena</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Meal name with autocomplete -->
  <div class="form-group">
    <label for="meal">Pasto</label>
    <div class="autocomplete">
      <input type="text" class="form-control form-control-lg" id="meal"
             name="meal" placeholder="Inserisci pasto...">
    </div>
  </div>

  <!-- Dessert + Note side by side -->
  <div class="row">
    <div class="col-6">
      <div class="form-group">
        <label for="dessert">Dessert</label>
        <input type="text" class="form-control" id="dessert"
               name="dessert" placeholder="Opzionale">
      </div>
    </div>
    <div class="col-6">
      <div class="form-group">
        <label for="notes">Note</label>
        <input type="text" class="form-control" id="notes"
               name="notes" placeholder="Opzionale">
      </div>
    </div>
  </div>

  <button type="submit" class="btn btn-primary btn-lg">Salva pasto</button>
</form>
{% endblock %}

{% block script %}
<!-- Meal list for autocomplete -->
<script type="text/javascript">
  try {var meal_list = {{ meal_list | tojson }};} catch (error) { console.error(error); }
</script>

<!-- Start Week toggle: sync switch to hidden input -->
<script type="text/javascript">
  function toggleStartWeek() {
    var sw = document.getElementById("startweek-switch");
    var input = document.getElementById("startweek-input");
    input.value = sw.checked ? "on" : "";
  }
</script>

<!-- Autocomplete -->
<script type="text/javascript" src="{{ url_for('static', filename='script_autocomplete.js') }}"></script>

<!-- Bootstrap Autocomplete (kept for compat) -->
<script type="text/javascript" src="https://cdn.jsdelivr.net/gh/xcash/bootstrap-autocomplete@v2.3.7/dist/latest/bootstrap-autocomplete.min.js"></script>
{% endblock %}
